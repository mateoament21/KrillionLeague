<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krillion League &amp; Cup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Silkscreen&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
/* Layout idea: a matchday programme. Navy scoreboard band on top, chalk-white pitch-side panels below, tables set like a league table. */
:root{
  --paper:#eef1f5; --surface:#ffffff; --ink:#15203a; --muted:#5a6579; --line:#d3d9e3;
  --band:#15203a; --band-ink:#f2f4f8;
  --accent:#c8364b; --gold:#c98a0b; --good:#2a7d52; --soft:#f6f8fb;
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e1424; --surface:#161f35; --ink:#e7ecf4; --muted:#9aa5bb; --line:#2a3553;
    --band:#0a0f1c; --band-ink:#e7ecf4;
    --accent:#f06a7e; --gold:#f0b53c; --good:#4cc38a; --soft:#1b2540;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1424; --surface:#161f35; --ink:#e7ecf4; --muted:#9aa5bb; --line:#2a3553;
  --band:#0a0f1c; --band-ink:#e7ecf4;
  --accent:#f06a7e; --gold:#f0b53c; --good:#4cc38a; --soft:#1b2540;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--body)}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:34px}
h2{font-size:24px}
h3{font-size:19px}
a{color:inherit}
.num,td.n,th.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.band{background:var(--band);color:var(--band-ink)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.band .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:14px;padding-bottom:14px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:30px}
.brand span{font-family:var(--mono);font-size:12px;opacity:.7}
.account{display:flex;gap:8px;align-items:center;font-size:12px;opacity:.85;order:3}
.account .btn{background:transparent;color:inherit;border-color:rgba(255,255,255,.3)}
input[type=email],input[type=password]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:var(--soft)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{text-decoration:none;font-family:var(--display);text-transform:uppercase;font-size:18px;letter-spacing:.03em;padding:6px 14px;border-radius:4px;opacity:.75}
nav.tabs a:hover{opacity:1;background:rgba(255,255,255,.08)}
nav.tabs a[aria-current="page"]{opacity:1;background:var(--accent);color:#fff}

main{padding:24px 0 60px}
main .wrap{display:grid;gap:20px}
.notice{border-left:4px solid var(--gold);background:var(--surface);padding:10px 14px;border-radius:4px;color:var(--muted)}
.notice.err{border-color:var(--accent)}
.notice:empty{display:none}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px}
.panel > h2,.panel > .ph{margin-bottom:12px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{display:grid;gap:6px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:6px;padding:14px 16px}
.card:hover{border-color:var(--muted);border-top-color:var(--accent)}
.card .meta{color:var(--muted);font-size:13px}
.card .lead{font-size:14px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pagehead .meta{color:var(--muted);font-size:14px;margin-top:4px}
.back{font-size:13px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink)}


label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin:0;line-height:1.3}
.field{display:grid;gap:6px}
form.stack,.stack{display:grid;gap:14px}
.stack > label + input,.stack > label + select,.stack > label + textarea{margin-top:-8px}
label.check{display:flex;align-items:center;gap:8px;font-weight:400;color:var(--ink)}
label.check input{width:auto}
input[type=text],input[type=number],input[type=date],input[type=search],select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:var(--soft)}
input:focus,select:focus{border-color:var(--accent);outline:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > input{flex:1;min-width:140px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:4px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:13px;color:var(--muted);margin:0}
textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--soft);font-size:16px;resize:vertical}
textarea:focus{border-color:var(--accent);outline:none}
.preview{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;min-height:0}
.preview:empty{display:none}
.preview b{font-size:26px}
.preview .bad,.bad{color:var(--accent);font-size:13px}
.emo{letter-spacing:1px;white-space:nowrap}
details summary{cursor:pointer;font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.stats div{border:1px solid var(--line);border-radius:4px;padding:8px 12px;display:grid}
.stats span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stats b{font-size:22px}
.focus{display:flex;align-items:center;gap:16px;margin:14px 0 10px;flex-wrap:wrap}
.focus .big{display:flex;align-items:baseline;gap:6px;background:var(--ink);color:var(--surface);padding:6px 14px;border-radius:4px}
.focus .big b{font-family:var(--display);font-size:40px;line-height:1}
.focus .big span{font-size:13px;opacity:.8}
.focus .ft{font-family:var(--display);text-transform:uppercase;font-size:22px}
.focus .ft a{text-decoration:none}
tr.me td{background:color-mix(in srgb,var(--accent) 12%,transparent);font-weight:600}
.wrapseg{flex-wrap:wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#my-sel{max-width:360px}
.big-input{font-family:var(--mono);font-size:26px !important;font-weight:600}

table{border-collapse:collapse;width:100%}
.tablewrap{overflow-x:auto}
th,td{padding:8px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right}
td.pos{font-family:var(--mono);color:var(--muted);width:32px}
tr.leader td{background:color-mix(in srgb,var(--gold) 12%,transparent)}
tr.leader td.pos{color:var(--gold);font-weight:600}
td.pts{font-weight:600;font-size:16px}
tr.q td:first-child{box-shadow:inset 4px 0 0 var(--good)}
tr.q3 td:first-child{box-shadow:inset 4px 0 0 var(--gold)}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 5px;border-radius:3px;font-family:var(--mono);font-size:12px;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
.chip.win{background:var(--gold);border-color:var(--gold);color:#1a1300;font-weight:600}
.chip.miss{opacity:.5}
.form{display:flex;gap:3px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 12px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.pill{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.live{background:var(--accent);border-color:var(--accent);color:#fff}
.pill.done{color:var(--good);border-color:var(--good)}
.pill.gold{background:var(--gold);border-color:var(--gold);color:#1a1300}

ol.board{list-style:none;margin:0;padding:0;display:grid}
ol.board li{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
ol.board li .rk{font-family:var(--mono);color:var(--muted)}
ol.board li.top .rk{color:var(--gold);font-weight:600}
ol.board li .sc{font-family:var(--mono);font-weight:600}
ol.board li.missing{color:var(--muted)}
ul.plist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
ul.plist li{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:4px;padding:8px 10px}
ul.plist .sub{font-size:12px;color:var(--muted)}

.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.stage{flex:0 0 auto;border:1px solid var(--line);border-radius:4px;padding:6px 10px;background:var(--surface);min-width:112px}
.stage b{display:block;font-family:var(--display);text-transform:uppercase;font-size:16px;letter-spacing:.02em}
.stage span{font-size:12px;color:var(--muted);font-family:var(--mono)}
.stage.live{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.stage.done{opacity:.7}

.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.group h3{margin-bottom:8px}
.group table td,.group table th{padding:6px 5px}
.fixtures{display:grid;gap:4px;margin-top:10px}
.fx{display:grid;grid-template-columns:52px 1fr auto 1fr;gap:8px;align-items:center;font-size:13px;padding:4px 0;border-top:1px dashed var(--line)}
.fx .d{font-family:var(--mono);color:var(--muted);font-size:11px}
.fx .h{text-align:right;overflow:hidden;text-overflow:ellipsis}
.fx .a{overflow:hidden;text-overflow:ellipsis}
.fx .s{font-family:var(--mono);font-weight:600;text-align:center;min-width:92px}
.fx .w{font-weight:600}
.fx.live .s{color:var(--accent)}

.bracket{display:flex;gap:18px;overflow-x:auto;padding-bottom:8px}
.round{flex:0 0 220px;display:flex;flex-direction:column;gap:10px}
.round h3{font-size:17px}
.round .rd{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:-6px}
.round .ms{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:10px}
.mbox{border:1px solid var(--line);border-radius:4px;background:var(--surface);overflow:hidden}
.mbox.live{border-color:var(--accent)}
.mbox .ln{display:flex;justify-content:space-between;gap:8px;padding:5px 9px;font-size:13px}
.mbox .ln + .ln{border-top:1px solid var(--line)}
.mbox .ln.w{font-weight:600;background:color-mix(in srgb,var(--good) 10%,transparent)}
.mbox .ln.out{color:var(--muted)}
.mbox .ln .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbox .ln .seed{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:6px}
.mbox .ln .v{font-family:var(--mono)}
.mbox .tb{font-size:11px;color:var(--muted);padding:3px 9px;border-top:1px dashed var(--line)}
.champ{display:flex;align-items:center;gap:14px;border:2px solid var(--gold);border-radius:6px;padding:14px 18px;background:color-mix(in srgb,var(--gold) 10%,var(--surface))}
.champ .t{font-family:var(--display);font-size:30px;text-transform:uppercase}

.picker{border:1px solid var(--line);border-radius:4px;max-height:260px;overflow:auto;padding:4px}
.picker label{display:flex;align-items:center;gap:8px;margin:0;padding:5px 6px;color:var(--ink);font-weight:400;font-size:14px;border-radius:3px;cursor:pointer}
.picker label:hover{background:var(--soft)}
.preview-groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.preview-groups div{border:1px solid var(--line);border-radius:4px;padding:8px;font-size:13px}
.preview-groups b{font-family:var(--display);text-transform:uppercase;font-size:15px;display:block}

.empty{color:var(--muted);text-align:center;padding:28px 12px;border:1px dashed var(--line);border-radius:6px}
dialog{border:1px solid var(--line);border-radius:8px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(8,12,24,.55)}
dialog .dl{padding:20px;display:grid;gap:12px}
dialog .actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:4px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px)}
#toast.on{opacity:1}
.rules{font-size:13px;color:var(--muted);margin:0;padding-left:18px}

/* ---------- trophy case: pixel art ---------- */
.px{image-rendering:pixelated;shape-rendering:crispEdges;display:block}
.tc-stats{display:flex;gap:10px;flex-wrap:wrap}
.tc-stats div{font-family:"Silkscreen",var(--mono);font-size:12px;text-transform:uppercase;border:3px solid var(--ink);padding:6px 10px;background:var(--surface);box-shadow:3px 3px 0 var(--ink)}
.tc-stats b{font-size:18px;margin-left:6px}
.case{--wood:#7a4a24;--wood-d:#4e2c12;--wood-l:#a8693a;position:relative;background:var(--wood);padding:14px;border:4px solid var(--wood-d);box-shadow:inset 0 0 0 4px var(--wood-l),6px 6px 0 rgba(0,0,0,.35)}
.case:before{content:"";position:absolute;left:50%;top:-22px;transform:translateX(-50%);height:18px;width:min(320px,70%);background:var(--wood-d);border:4px solid var(--wood-d);box-shadow:inset 0 0 0 3px var(--wood-l)}
.case .sign{position:absolute;left:50%;top:-20px;transform:translateX(-50%);font-family:"Silkscreen",var(--mono);font-size:12px;color:#f6d88b;letter-spacing:.08em;white-space:nowrap;z-index:1}
.case .glass{position:relative;background:#0f1830;border:4px solid var(--wood-d);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));overflow:hidden}
@media (max-width:560px){.case .glass{grid-template-columns:repeat(2,minmax(0,1fr))}}
.case .glass:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(135deg,transparent 0 60px,rgba(255,255,255,.06) 60px 72px,transparent 72px 90px,rgba(255,255,255,.04) 90px 96px,transparent 96px 220px)}
.slot{position:relative;height:190px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 8px 0;border-bottom:12px solid var(--wood);box-shadow:inset 0 -4px 0 var(--wood-l), 0 4px 0 var(--wood-d)}
.slot .lamp{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0,rgba(255,236,170,.13),transparent 65%);pointer-events:none}
.slot .px.trophy{width:96px;height:96px;margin-bottom:4px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.45))}
.slot .plate{font-family:"Silkscreen",var(--mono);font-size:9px;line-height:1.25;color:#2a1a08;background:#d9b45a;border:2px solid #8a6420;padding:2px 6px;margin-bottom:6px;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .plate span{display:block;color:#5a3d10}
.deco{position:absolute;inset:0 0 12px 0;pointer-events:none;z-index:2;overflow:hidden}
.deco svg{position:absolute;image-rendering:pixelated;shape-rendering:crispEdges}
.deco .web.tr{transform:scaleX(-1)}
.deco .web.bl{transform:scaleY(-1)}
.deco .web.br{transform:scale(-1,-1)}
.deco .spider{animation:dangle 5s ease-in-out infinite;transform-origin:50% 0}
@keyframes dangle{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.slot.new .px.trophy{animation:shine 2.4s steps(6) infinite}
@keyframes shine{0%,80%{filter:drop-shadow(0 4px 0 rgba(0,0,0,.45)) brightness(1)}90%{filter:drop-shadow(0 4px 0 rgba(0,0,0,.45)) brightness(1.35)}}
.tc-empty{font-family:"Silkscreen",var(--mono);text-align:center;color:var(--muted);font-size:13px;margin-top:4px}
.tc-list{display:grid;gap:6px}
.tc-list li{list-style:none;display:flex;gap:10px;align-items:center;font-size:14px;border-bottom:1px solid var(--line);padding:6px 0}
.tc-list li svg{width:28px;height:28px;flex:0 0 auto}
.tc-list{padding:0;margin:0}
@media (prefers-reduced-motion: reduce){.slot.new .px.trophy,.deco .spider{animation:none}}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="brand"><h1>Krillion League &amp; Cup</h1><span id="today-label"></span></div>
    <div class="account" id="account"></div>
    <nav class="tabs" aria-label="Sections">
      <a href="#scores" data-tab="scores">Scores</a>
      <a href="#leagues" data-tab="leagues">Leagues</a>
      <a href="#cups" data-tab="cups">Tournaments</a>
      <a href="#trophies" data-tab="trophies">Trophies</a>
    </nav>
  </div>
</header>
<main><div class="wrap">
  <div id="status" class="notice">Connecting to the scoreboard…</div>
  <div id="view"></div>
</div></main>
<dialog id="dlg"><div class="dl" id="dlg-body"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function addDays(s, n) { const [y, m, d] = s.split("-").map(Number); const t = new Date(Date.UTC(y, m - 1, d + n)); return `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}-${pad(t.getUTCDate())}`; }
function dateRange(a, b) { const out = []; if (!a || a > b) return out; for (let x = a; x <= b && out.length < 3700; x = addDays(x, 1)) out.push(x); return out; }
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
function fmtDate(s, withDow) { if (!s) return ""; const [y, m, d] = s.split("-").map(Number); const w = new Date(Date.UTC(y, m - 1, d)).getUTCDay(); return (withDow ? DOW[w] + " " : "") + d + " " + MON[m - 1]; }
const uid = () => Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 8);
const fmtN = n => Number(n).toLocaleString("en-GB");
const LETTERS = "ABCDEFGHIJKLMNOP";
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 3200); }

/* ---------- state ---------- */
let db = null, canWrite = true;
const S = { calendar: null, players: new Map(), leagues: new Map(), cups: new Map(), loaded: { players: false, leaguedefs: false, cupdefs: false, memberships: false } };
const ui = { leaguePeriod: "season", focus: null, authMode: "in" };
const me = { uid: null, email: null, isOwner: false, booted: false };
let mountedAs = null;
/* names are unique: compared after folding case, accents, spacing and punctuation, so "Matéo", "mateo" and "Mat eo" clash */
const nameKey = n => String(n || "").normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "");
const cleanName = n => String(n || "").replace(/\s+/g, " ").trim().slice(0, 40);

/* ---------- writes: one at a time per doc ---------- */
const queues = new Map();

const leagueMembers = lg => membersOf(lg, "leagues");

/* ---------- league maths ---------- */
/* Seasons last 14 days, counted in blocks from the league's season anchor.
   Ending a season early records it in lg.history and moves the anchor to today. */
const SEASON_DAYS = 14;
function daysBetween(a, b) { const f = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); }; return Math.round((f(b) - f(a)) / 864e5); }

  const past = history.map(h => ({ start: h.start, end: h.end, early: !!h.early }));
  let k = 0;

    k = Math.floor(daysBetween(anchor, today) / SEASON_DAYS);
    for (let i = 0; i < k; i++) past.push({ start: addDays(anchor, i * SEASON_DAYS), end: addDays(anchor, i * SEASON_DAYS + SEASON_DAYS - 1) });

  past.forEach((x, i) => x.no = i + 1);
  const start = addDays(anchor, k * SEASON_DAYS);
  const current = { start, end: addDays(start, SEASON_DAYS - 1), no: past.length + 1, current: true, notStarted: today < start };
  current.day = current.notStarted ? 0 : daysBetween(start, today) + 1;

}
/* the day a player joined the league: their own join, or the day the creator added them after creating it.

function joinDay(lg, pid) {
  const m = S.raw.memberships.get(pid)?.leagues?.[lg.id];
  const ts = (m && !m.left && m.at) || lg.addedAt?.[pid];
  return ts ? dayOf(ts) : null;
}

  if (period && period.startsWith("past:")) { const x = past[+period.slice(5)]; if (x) return { ...x, season: x }; }

}

  const rows = members.map(pid => ({ pid, name: pname(pid), P: 0, pts: 0, real: 0, bonus: 0, filled: 0, best: 0, W: 0, form: [] }));
  const dayRank = {};
  for (const d of dates) {
    const vals = rows.map(r => sc(r.pid, d));
    const played = vals.filter(v => v != null);
    if (!played.length) continue;
    const max = Math.max(...played);
    rows.forEach((r, i) => {
      const v = vals[i]; if (v == null) return;
      r.P++; r.real += v; r.best = Math.max(r.best, v);

    `Season ${current.no} closes with yesterday's scores${lead && lead.pts ? ` (${lead.name} is top on ${fmtN(lead.pts)})` : ""}. Season ${current.no + 1} starts today and runs 14 days, so everyone starts from zero. Today's scores count in the new season. This can't be undone.`,
    "End season",
    // every finished season goes into history, because moving the anchor would otherwise lose the automatic ones

/* ---------- tournament engine ---------- */

    else { m = 2 * k <= G ? k : G - k; direct = G - 2 * m; out = G - direct - 2 * m; }
  }
  const kStart = m > 0 ? 4 : 3;

}

    else s += `, plus all ${f.G} third-placed players` + (f.extraByes ? ` and ${f.extraByes} bye${f.extraByes > 1 ? "s" : ""} for the best group winners` : "");

function cupModel(cup) {

    if (a === undefined || b === undefined) { m.tbd = true; return m; }
    if (a === null || b === null) { m.bye = true; m.decided = true; m.winner = a ?? b; return m; }
    m.sa = sc(a, d); m.sb = sc(b, d);
    const closed = d < today;
    if (!((m.sa != null && m.sb != null) || closed)) return m;
    m.decided = true;

    else if (ko) {
      const ta = totalBefore(a, d), tb = totalBefore(b, d);

      else { m.winner = (seedOf.get(a) ?? 99) <= (seedOf.get(b) ?? 99) ? a : b; m.note = "Level: higher seed goes through"; }

  stages.forEach(s => s.state = s.date < today ? "done" : s.date === today ? "live" : "next");

  const all = [...gm.flatMap(g => g.matches), ...thirds.matches, ...rounds.flatMap(rd => rd.matches), ...(bronze ? [bronze] : [])];

}

/* ---------- routing & rendering ---------- */
let route = null;
function parseRoute() {

  if (h.startsWith("cup-")) return { tab: "cups", id: h.slice(4) };
  if (h === "leagues" || h === "cups" || h === "trophies") return { tab: h };

}

  $$("nav.tabs a").forEach(a => { if (a.dataset.tab === route.tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  mount(); update();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", onRoute);

function renderStatus() {
  const el = $("#status");
  const allLoaded = Object.values(S.loaded).every(Boolean);
  if (!db && me.booted && !me.uid && !statusMsg) { el.className = "notice"; el.textContent = ""; return; }
  if (!db) { el.className = "notice err"; el.textContent = statusMsg || "Connecting to the scoreboard…"; return; }
  if (!canWrite) { el.className = "notice"; el.textContent = "You can view the tables but not add scores."; return; }
  if (!allLoaded) { el.className = "notice"; el.textContent = statusMsg || "Loading scores…"; return; }
  el.className = "notice"; el.textContent = "";
}
let statusMsg = "";

function mount() {
  const v = $("#view");

  if (me.booted && !me.uid && sb) { v.innerHTML = authHtml(); wireAuth(); return; }

function update() {
  $("#today-label").textContent = fmtDate(todayStr(), true);

  if (route.tab === "scores") updateScores();
  else if (route.tab === "leagues" && !route.id) updateLeagueList();

/* ---------- share-text parsing ---------- */
/* the only accepted input: the exact share text
     Krillion #122 🦐
     330
     (blank line)
     ⬛🦑🫧🐟🏮🦑🏮 */
function parseResult(txt) {
  if (!txt || !txt.trim()) return null;
  const lines = txt.replace(/\r/g, "").split("\n").map(l => l.trim()).filter(Boolean);
  const head = lines[0] && lines[0].match(/^Krillion\s*#(\d{1,6})(?:\s+\S.*)?$/i);
  if (!head) return { error: "That isn't a Krillion result. Paste the whole share text, starting with “Krillion #”." };
  const sm = lines[1] && lines[1].match(/^(\d{1,3}(?:,\d{3})+|\d{1,7})$/);
  if (!sm) return { error: "The second line should be your score. Paste the share text exactly as Krillion copies it." };
  const emoji = lines.slice(2).join(" ");
  if (!emoji || /[\p{L}\p{N}]/u.test(emoji.replace(/[⬛⬜]/g, ""))) return { error: "The emoji line is missing. Paste the whole share text, including the emoji row." };
  return { n: Number(head[1]), score: Number(sm[1].replace(/,/g, "")), emoji: Array.from(lines[2]).slice(0, 24).join("") };
}
/* puzzle number -> calendar day, from the anchor in meta/calendar */
function dateForPuzzle(n) {
  const a = S.calendar;
  if (n == null || !a || typeof a.n !== "number" || !a.date) return null;
  return addDays(a.date, n - a.n);
}
function todaysPuzzle() { const a = S.calendar; return a && typeof a.n === "number" && a.date ? a.n + daysBetween(a.date, todayStr()) : null; }

function sortedPlayers() { return [...S.players.values()].sort((a, b) => (a.name || "").localeCompare(b.name || "")); }
const canEditPlayer = pid => canWrite && (pid === me.uid || me.isOwner);
function targetPid() { return me.uid; }
function updateScores() {
  const want = scoresMode();
  if (mountedAs !== want) mount();
  if (want !== "app") return;
  const ps = sortedPlayers();
  $("#me-pill").textContent = "Signed in as " + pname(me.uid);
  syncScoreForm(); renderBoard(); renderMyLog();
  const pl = $("#player-list");
  pl.innerHTML = ps.map(p => {
    const vals = Object.values(p.scores || {}).filter(v => typeof v === "number");
    const tot = vals.reduce((a, b) => a + b, 0);
    const btns = me.isOwner && p.id !== me.uid ? `<div class="row"><button class="btn small" type="button" data-rename="${esc(p.id)}">Rename</button><button class="btn small danger" type="button" data-delp="${esc(p.id)}">Delete</button></div>` : "";
    return `<li><div><div>${esc(p.name)}${p.id === me.uid ? " <span class='sub'>(you)</span>" : ""}</div><div class="sub">${p.account ? "" : "No account · "}${vals.length} day${vals.length === 1 ? "" : "s"} · ${fmtN(tot)} pts</div></div>${btns}</li>`;
  }).join("");
  $("#pl-note").textContent = "Friends appear here once they open the page and create a profile. Everyone logs their own result.";
  $$("#player-list button, #rename-me").forEach(b => b.disabled = !canWrite || !db);
}
function currentEntry() {
  const e = parseResult($("#sf-paste")?.value);
  if (!e || e.error) return e;
  const today = todayStr(), d = dateForPuzzle(e.n) || (S.calendar ? null : today), tp = todaysPuzzle();
  if (d && d < today) return { ...e, error: `That's Krillion #${e.n}, from ${fmtDate(d, true)}. You can only log today's puzzle${tp ? ` (#${tp})` : ""}, on the day.` };
  if (d && d > today) return { ...e, error: `Krillion #${e.n} should be ${fmtDate(d, true)}'s puzzle, but today's is #${tp}. If you really played #${e.n} today, the site's puzzle calendar is off: tell the admin.` };
  return { ...e, date: today };
}
function syncScoreForm() {
  const today = todayStr(), cur = me.uid ? sc(me.uid, today) : null;
  const note = $("#sf-note"), pv = $("#sf-preview"), save = $("#sf-save");
  if (!note) return;
  $("#sf-body").hidden = cur != null;
  if (cur != null) {
    const g = S.players.get(me.uid)?.games?.[today];
    note.innerHTML = `<b class="num" style="font-size:22px">${fmtN(cur)}</b> locked in for today${g?.e ? ` <span class="emo">${esc(g.e)}</span>` : ""}. Come back tomorrow for the next puzzle.`;
    save.hidden = true; return;
  }
  save.hidden = false;
  const e = currentEntry();
  if (!e) { pv.innerHTML = ""; note.textContent = todaysPuzzle() ? `Today's puzzle is Krillion #${todaysPuzzle()}.` : ""; save.disabled = true; return; }
  if (e.error) { pv.innerHTML = `<span class="bad">${esc(e.error)}</span>`; note.textContent = ""; save.disabled = true; return; }
  pv.innerHTML = `<span class="num">Krillion #${esc(e.n)}</span><b class="num">${fmtN(e.score)}</b><span class="emo">${esc(e.emoji)}</span>`;
  note.textContent = "Check it's right: once saved it can't be changed.";
  save.disabled = !canWrite || !db;
}
function renderBoard() {
  const d = ui.boardDay && ui.boardDay < todayStr() ? ui.boardDay : todayStr();
  if ($("#bd-next")) $("#bd-next").disabled = d >= todayStr();
  $("#board-title").textContent = d === todayStr() ? "Today's board" : "Board for " + fmtDate(d, true);
  const ps = sortedPlayers();
  const inn = ps.filter(p => sc(p.id, d) != null).sort((a, b) => sc(b.id, d) - sc(a.id, d));
  const out = ps.filter(p => sc(p.id, d) == null);
  $("#board-count").textContent = `${inn.length}/${ps.length} in`;
  const top = inn.length ? sc(inn[0].id, d) : null;
  let html = inn.map(p => { const v = sc(p.id, d); const rk = 1 + inn.filter(q => sc(q.id, d) > v).length; const g = p.games?.[d]; return `<li class="${v === top ? "top" : ""}"><span class="rk">${rk}</span><span>${esc(p.name)}${g?.e ? ` <span class="emo">${esc(g.e)}</span>` : ""}</span><span class="sc">${fmtN(v)}</span></li>`; }).join("");
  html += out.map(p => `<li class="missing"><span class="rk">–</span><span>${esc(p.name)}</span><span class="note">not in yet</span></li>`).join("");
  $("#day-board").innerHTML = html || `<li class="empty" style="display:block">No players yet.</li>`;
}
const ord = n => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th");
function myCupStatus(cup, M) {
  if (M.champion === me.uid) return "Champion";
  const ko = [...M.thirds.matches, ...M.rounds.flatMap(r => r.matches.map(m => ({ ...m, rname: r.name }))), ...(M.bronze ? [{ ...M.bronze, rname: "Third-place match" }] : [])];
  const lost = ko.find(m => m.decided && !m.bye && m.loser === me.uid && m.rname !== "Third-place match");
  const mine = m => !m.tbd && !m.bye && (m.a === me.uid || m.b === me.uid);
  const next = [...M.gm.flatMap(g => g.matches), ...ko].filter(m => mine(m) && !m.decided).sort((x, y) => x.date < y.date ? -1 : 1)[0];
  if (next) { const opp = next.a === me.uid ? next.b : next.a; return `${next.date === todayStr() ? "Today" : "Next, " + fmtDate(next.date, true)}: v ${pname(opp)}${next.rname ? " (" + next.rname + ")" : ""}`; }
  if (lost) return M.thirds.matches.includes(M.thirds.matches.find(m => m.loser === me.uid)) ? "Out in the third-place play-off" : `Knocked out in the ${lost.rname}`;
  if (M.groupsDone) {
    const g = M.gm.find(x => x.rows.some(r => r.pid === me.uid)), i = g.rows.findIndex(r => r.pid === me.uid), row = g.rows[i];
    if (i === 3 || (i === 2 && (M.thirds.out.includes(row) || M.f.k === 0))) return "Out in the group stage";
    if (!M.ready && (i < 2 || M.thirds.direct.includes(row))) return "Through to the knockouts. Waiting for the play-off to finish";
  }
  if (M.final.decided) return M.bronze?.winner === me.uid ? "Third place" : "Finished";
  return "Waiting for the next round to be set";
}
function renderMyLog() {
  const p = S.players.get(me.uid); if (!p) return;
  const vals = Object.values(p.scores || {}).filter(v => typeof v === "number");
  const tot = vals.reduce((a, b) => a + b, 0);
  const leagues = [...S.leagues.values()].filter(l => leagueMembers(l).includes(me.uid)).sort((a, b) => a.name.localeCompare(b.name));
  const cups = [...S.cups.values()].filter(c => c.status === "drawn" && Array.isArray(c.groups) && c.groups.flat().includes(me.uid)).sort((a, b) => a.name.localeCompare(b.name));
  const opts = [...leagues.map(l => ({ key: "l:" + l.id, label: l.name, kind: "League" })), ...cups.map(c => ({ key: "c:" + c.id, label: c.name, kind: "Tournament" }))];
  const leaguePos = leagues.map(l => leagueTable(l, "season").rows.find(r => r.pid === me.uid)?.pos).filter(Boolean);
  $("#my-stats").innerHTML = [["Average", vals.length ? fmtN(Math.round(tot / vals.length)) : "–"], ["Best", vals.length ? fmtN(Math.max(...vals)) : "–"], ["Leagues", leagues.length], ["Best standing", leaguePos.length ? ord(Math.min(...leaguePos)) : "–"]]
    .map(([k, v]) => `<div><span>${k}</span><b class="num">${v}</b></div>`).join("");
  if (!opts.length) { $("#my-switch").innerHTML = ""; $("#my-log").innerHTML = `<div class="empty">You're not in a league or tournament yet. <a href="#leagues">Find a league</a> or <a href="#cups">a tournament</a>.</div>`; return; }
  let key = ui.focus || lsGet("kc-focus");
  if (!opts.some(o => o.key === key)) key = opts[0].key;
  ui.focus = key;
  $("#my-switch").innerHTML = opts.length < 2 ? "" : opts.length <= 4
    ? `<div class="seg wrapseg" role="group" aria-label="Choose a league or tournament">${opts.map(o => `<button type="button" data-focus="${esc(o.key)}" aria-pressed="${o.key === key}">${esc(o.label)}</button>`).join("")}</div>`
    : `<label for="my-sel" class="sr">Choose a league or tournament</label><select id="my-sel">${["League", "Tournament"].map(k => { const g = opts.filter(o => o.kind === k); return g.length ? `<optgroup label="${k}s">${g.map(o => `<option value="${esc(o.key)}" ${o.key === key ? "selected" : ""}>${esc(o.label)}</option>`).join("")}</optgroup>` : ""; }).join("")}</select>`;
  const pick = k => { ui.focus = k; lsSet("kc-focus", k); renderMyLog(); };
  $$("[data-focus]").forEach(b => b.onclick = () => pick(b.dataset.focus));
  if ($("#my-sel")) $("#my-sel").onchange = e => pick(e.target.value);
  const id = key.slice(2);
  if (key[0] === "l") {
    const lg = S.leagues.get(id), t = leagueTable(lg, "season"), r = t.rows.find(x => x.pid === me.uid);
    const lead = t.rows[0], second = t.rows[1];
    const gapTxt = t.rows.length < 2 ? "You're the only player so far" : r.pos === 1 ? (second && second.pts === r.pts ? `Level with ${second.name}` : `${fmtN(r.pts - second.pts)} ahead of ${second.name}`) : `${fmtN(lead.pts - r.pts)} behind ${lead.name}`;
    $("#my-log").innerHTML = `<div class="focus"><div class="big"><b>${ord(r.pos)}</b><span>of ${t.rows.length}</span></div><div><div class="ft"><a href="#league-${esc(lg.id)}">${esc(lg.name)}</a></div><div class="note">${fmtN(r.pts)} pts · ${esc(gapTxt)}</div></div></div>
      <div class="tablewrap"><table><thead><tr><th></th><th>Player</th><th class="n">P</th><th class="n">Avg</th><th class="n">Best</th><th class="n">Pts</th></tr></thead><tbody>${t.rows.map(x => `<tr class="${x.pid === me.uid ? "me" : ""}"><td class="pos">${x.pos}</td><td>${esc(x.name)}${x.pid === me.uid ? ' <span class="note">(you)</span>' : ""}</td><td class="n">${x.P}</td><td class="n">${x.P ? fmtN(Math.round(x.avg)) : "–"}</td><td class="n">${x.P ? fmtN(x.best) : "–"}</td><td class="n pts">${fmtN(x.pts)}</td></tr>`).join("")}</tbody></table></div>`;
  } else {
    const cup = S.cups.get(id), M = cupModel(cup);
    const g = M.gm.find(x => x.rows.some(r => r.pid === me.uid)); const gi = g.rows.findIndex(r => r.pid === me.uid);
    $("#my-log").innerHTML = `<div class="focus"><div class="big"><b>${ord(gi + 1)}</b><span>in Group ${g.letter}</span></div><div><div class="ft"><a href="#cup-${esc(cup.id)}">${esc(cup.name)}</a></div><div class="note">${esc(myCupStatus(cup, M))}</div></div></div>
      <div class="tablewrap"><table><thead><tr><th></th><th>Player</th><th class="n">P</th><th class="n">W</th><th class="n">D</th><th class="n">L</th><th class="n">+/−</th><th class="n">Pts</th></tr></thead><tbody>${g.rows.map((r, i) => `<tr class="${r.pid === me.uid ? "me" : ""} ${i < 2 ? "q" : i === 2 && M.f.k > 0 ? "q3" : ""}"><td class="pos">${i + 1}</td><td>${esc(pname(r.pid))}${r.pid === me.uid ? ' <span class="note">(you)</span>' : ""}</td><td class="n">${r.P}</td><td class="n">${r.W}</td><td class="n">${r.D}</td><td class="n">${r.L}</td><td class="n">${r.GF - r.GA > 0 ? "+" : ""}${fmtN(r.GF - r.GA)}</td><td class="n pts">${r.Pts}</td></tr>`).join("")}</tbody></table></div>`;
  }
}

/* ---------- league views ---------- */
function seasonLabel(lg, long) {
  const c = seasonsOf(lg).current;
  if (c.notStarted) return `season ${c.no} starts ${fmtDate(c.start, long)}`;
  const left = SEASON_DAYS - c.day;
  return `season ${c.no} · day ${c.day} of ${SEASON_DAYS}` + (long ? ` · ${left ? `ends ${fmtDate(c.end, true)}` : "last day today"}` : "");
}
function periodNote(lg, t) {
  const r = t.range;
  if (r.season && r.current) return `Season ${r.no}: ${fmtDate(r.start, true)} – ${fmtDate(r.end, true)}.`;
  if (r.season) return `Season ${r.no}: ${fmtDate(r.start, true)} – ${fmtDate(r.end, true)}${r.early ? " (ended early)" : ""}. Final table.`;
  return `${fmtDate(r.start, true)} – today.`;
}
function pastSeasonsHtml(lg, SS) {
  if (!SS.past.length) return "";
  const items = SS.past.map((x, i) => ({ x, i, t: leagueTable(lg, "past:" + i) })).reverse();
  return `<section class="panel"><h2>Past seasons</h2><div class="tablewrap"><table><thead><tr><th>Season</th><th>Dates</th><th>Winner</th><th class="n">Pts</th><th></th></tr></thead><tbody>${items.map(({ x, i, t }) => { const w = t.rows[0]; return `<tr><td>${x.no}</td><td>${fmtDate(x.start)} – ${fmtDate(x.end)}${x.early ? ' <span class="note">(ended early)</span>' : ""}</td><td>${w && w.pts ? esc(w.name) : "–"}</td><td class="n">${w && w.pts ? fmtN(w.pts) : "–"}</td><td><button class="btn small" type="button" data-season="${i}">View table</button></td></tr>`; }).join("")}</tbody></table></div></section>`;
}
function searchBlock(kind) {
  const what = kind === "leagues" ? "leagues" : "tournaments";
  return `<section class="panel" style="display:grid;gap:12px"><div class="ph"><h2>Find ${kind === "leagues" ? "a league" : "a tournament"}</h2><span class="pill" id="lf-count"></span></div>

function fillSearch(kind, others, card) {

}
function leagueCard(lg) {
  const t = leagueTable(lg, "season"); const lead = t.rows[0]; const n = leagueMembers(lg).length;

function updateLeagueDetail() {

  const nSpokes = 3 + Math.floor(rnd() * 4);                       // 3–6 spokes
  const angles = Array.from({ length: nSpokes }, (_, i) => i === 0 ? 0 : i === nSpokes - 1 ? 90 : (90 * i / (nSpokes - 1)) + (rnd() - 0.5) * 60 / nSpokes).map(a => a * Math.PI / 180);

const PLACE = { 1: { metal: "gold", word: "Winner" }, 2: { metal: "silver", word: "Runner-up" }, 3: { metal: "bronze", word: "Third" } };
function trophiesOf(pid) {
  const out = [];
  for (const lg of S.leagues.values()) {
    seasonsOf(lg).past.forEach((x, i) => {
      const t = leagueTable(lg, "past:" + i), played = t.rows.filter(r => r.P > 0);
      if (played.length < 2) return;
      const r = t.rows.find(r => r.pid === pid);
      if (!r || !r.P || r.pos > 3 || r.pos > played.length - 1) return;
      out.push({ kind: "league", sprite: "medal", place: r.pos, metal: PLACE[r.pos].metal, title: lg.name, sub: `Season ${x.no}`, date: x.end, pts: r.pts, href: "#league-" + lg.id });
    });
  }
  for (const c of S.cups.values()) {
    if (c.status !== "drawn" || !Array.isArray(c.groups) || !c.groups.length) continue;
    let M; try { M = cupModel(c); } catch { continue; }
    if (!M.champion) continue;
    const place = M.champion === pid ? 1 : M.final.loser === pid ? 2 : M.bronze?.decided && M.bronze.winner === pid ? 3 : 0;
    if (place) out.push({ kind: "cup", sprite: "cup", place, metal: PLACE[place].metal, title: c.name, sub: PLACE[place].word, date: M.endDate, href: "#cup-" + c.id });

function makeDb(sb) {
  const cache = new Map(), subs = new Map();
  const split = path => { const [coll, id] = path.split("/"); return { coll, id }; };
  const snapOf = coll => { const m = cache.get(coll) || new Map(); return { docs: [...m].map(([id, d]) => ({ id, exists: true, data: () => d })), size: m.size, empty: !m.size, metadata: { fromCache: false, hasPendingWrites: false } }; };
  const emit = coll => (subs.get(coll) || new Set()).forEach(cb => { try { cb(snapOf(coll)); } catch (e) { console.error(e); } });
  const put = (coll, id, data) => { if (!cache.has(coll)) cache.set(coll, new Map()); if (data == null) cache.get(coll).delete(id); else cache.get(coll).set(id, data); emit(coll); };
  async function load(coll) {
    const { data, error } = await sb.from("docs").select("id,data").eq("coll", coll);
    if (error) throw mapErr(error);
    cache.set(coll, new Map(data.map(r => [r.id, r.data]))); emit(coll);
  }
  sb.channel("docs-changes").on("postgres_changes", { event: "*", schema: "public", table: "docs" }, p => {
    const row = p.eventType === "DELETE" ? p.old : p.new; if (!row?.coll) return;
    put(row.coll, row.id, p.eventType === "DELETE" ? null : row.data);
  }).subscribe();
  // catch up when the tab comes back (phones drop realtime connections in the background)
  document.addEventListener("visibilitychange", () => { if (!document.hidden) [...subs.keys()].forEach(c => load(c).catch(() => {})); });
  function doc(path) {
    const { coll, id } = split(path);
    return {
      id, path,
      async get() { const { data, error } = await sb.from("docs").select("data").eq("coll", coll).eq("id", id).maybeSingle(); if (error) throw mapErr(error); return { id, exists: !!data, data: () => data?.data }; },
      async set(body) { const { error } = await sb.from("docs").upsert({ coll, id, data: body, updated_at: new Date().toISOString() }); if (error) throw mapErr(error); put(coll, id, body); },
      async update(patch) {
        const cur = await this.get(); if (!cur.exists) throw { code: "invalid_argument", message: "Document doesn't exist." };
        const body = deepMerge(cur.data(), patch);
        const { error } = await sb.from("docs").update({ data: body, updated_at: new Date().toISOString() }).eq("coll", coll).eq("id", id); if (error) throw mapErr(error); put(coll, id, body);
      },
      async delete() { const { error } = await sb.from("docs").delete().eq("coll", coll).eq("id", id); if (error) throw mapErr(error); put(coll, id, null); },
      onSnapshot(next, onErr) {
        return collection(coll).onSnapshot(s => { const d = s.docs.find(x => x.id === id); next(d || { id, exists: false, data: () => undefined }); }, onErr);
      }
    };
  }
  function collection(coll) {
    return {
      path: coll, doc: id => doc(coll + "/" + id),
      async get() { await load(coll); return snapOf(coll); },
      onSnapshot(next, onErr) {
        const first = !subs.has(coll); if (first) subs.set(coll, new Set());
        subs.get(coll).add(next);
        if (first) load(coll).catch(e => onErr && onErr(e)); else next(snapOf(coll));
        return () => subs.get(coll)?.delete(next);
      }
    };
  }
  return { doc, collection };
}

/* ---------- sign-in ---------- */
let sb = null;
/* email links (confirm, reset) come back to the site root; the login tokens ride in the #fragment */
const SITE_URL = () => location.origin + "/";
/* read what an email link brought back before the router or Supabase touch the URL */
const AUTH_HASH = (() => { const h = new URLSearchParams((location.hash || "").replace(/^#/, "")); return { recovery: h.get("type") === "recovery", error: h.get("error_description") || h.get("error"), code: h.get("error_code") }; })();
function authHtml() {
  return `<section class="panel" style="max-width:460px">
    <div class="seg" role="group" aria-label="Sign in or create an account" style="margin-bottom:14px"><button type="button" data-am="in" aria-pressed="${ui.authMode !== "up"}">Sign in</button><button type="button" data-am="up" aria-pressed="${ui.authMode === "up"}">Create account</button></div>
    <form class="stack" id="au-form" autocomplete="on">
      <h2>${ui.authMode === "up" ? "Create an account" : "Sign in"}</h2>
      <div class="field"><label for="au-email">Email</label><input type="email" id="au-email" autocomplete="email" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="email" required value="${esc(ui.authEmail || "")}"></div>
      <div class="field"><label for="au-pw">Password</label><input type="password" id="au-pw" minlength="8" autocomplete="${ui.authMode === "up" ? "new-password" : "current-password"}" required>${ui.authMode === "up" ? `<p class="note">At least 8 characters.</p>` : ""}</div>
      <p class="${ui.authMsg?.ok ? "note" : "bad"}" id="au-err">${esc(ui.authMsg?.text || "")}</p>
      <div class="row"><button class="btn primary" type="submit" id="au-go">${ui.authMode === "up" ? "Create account" : "Sign in"}</button>${ui.authMode === "up" ? "" : `<button class="btn small" type="button" id="au-forgot">Forgot password?</button>`}</div>
    </form></section>`;
}
function wireAuth() {
  $$("[data-am]").forEach(b => b.onclick = () => { ui.authMode = b.dataset.am; mount(); });
  $("#au-form").onsubmit = async e => {
    e.preventDefault(); const email = $("#au-email").value.trim().toLowerCase(), password = $("#au-pw").value;
    ui.authEmail = email; ui.authMsg = null;
    $("#au-go").disabled = true; $("#au-err").className = "bad"; $("#au-err").textContent = "";
    let data, error;
    try { ({ data, error } = ui.authMode === "up" ? await sb.auth.signUp({ email, password, options: { emailRedirectTo: SITE_URL() } }) : await sb.auth.signInWithPassword({ email, password })); }
    catch (err) { error = { message: "Couldn't reach the login server. Check your connection and try again." }; }
    $("#au-go").disabled = false;
    if (error) {
      const m = error.message || "";
      if (/invalid login credentials/i.test(m)) $("#au-err").textContent = "Wrong email or password. Passwords are case-sensitive (phones often capitalise the first letter). Forgot it? Tap “Forgot password?”.";
      else if (/email not confirmed/i.test(m)) { $("#au-err").innerHTML = `This email hasn't been confirmed yet. <button class="btn small" type="button" id="au-resend">Resend confirmation email</button>`; $("#au-resend").onclick = async () => { const { error: e2 } = await sb.auth.resend({ type: "signup", email, options: { emailRedirectTo: SITE_URL() } }); $("#au-err").className = e2 ? "bad" : "note"; $("#au-err").textContent = e2 ? e2.message : "Sent. Open the link in the email, then sign in here."; }; }
      else if (/already registered/i.test(m)) $("#au-err").textContent = "There's already an account with that email. Switch to “Sign in”.";
      else if (/rate limit|too many/i.test(m)) $("#au-err").textContent = "Too many attempts or emails in a short time. Wait a few minutes and try again.";
      else $("#au-err").textContent = m;
      return;
    }
    if (ui.authMode === "up" && !data.session) { $("#au-err").className = "note"; $("#au-err").textContent = "Check your inbox and click the confirmation link, then sign in."; }
  };
  if ($("#au-forgot")) $("#au-forgot").onclick = async () => {
    const email = $("#au-email").value.trim().toLowerCase(); if (!email) { $("#au-err").className = "bad"; $("#au-err").textContent = "Type your email first."; return; }
    $("#au-forgot").disabled = true;
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: SITE_URL() });
    $("#au-forgot").disabled = false;
    $("#au-err").className = error ? "bad" : "note";
    $("#au-err").textContent = error ? (/rate limit|too many|seconds/i.test(error.message || "") ? "A reset email was sent very recently. Wait a minute, then try again." : error.message) : "If that email has an account, a reset link is on its way. Check spam too. The link works on any device, but only once and only for about an hour.";
  };
}
function resetDialog() {
  if (resetDialog.open) return; resetDialog.open = true;
  openDialog(`<h2>Choose a new password</h2><form class="stack" id="np-form"><div class="field"><label for="np-pw">New password</label><input type="password" id="np-pw" minlength="8" autocomplete="new-password" required></div><div class="field"><label for="np-pw2">Type it again</label><input type="password" id="np-pw2" minlength="8" autocomplete="new-password" required></div><p class="bad" id="np-err"></p><div class="actions"><button class="btn" type="button" id="np-c">Cancel</button><button class="btn primary" type="submit" id="np-go">Save password</button></div></form>`);
  $("#np-c").onclick = () => { resetDialog.open = false; closeDialog(); };
  $("#np-form").onsubmit = async e => {
    e.preventDefault();
    if ($("#np-pw").value !== $("#np-pw2").value) { $("#np-err").textContent = "The two passwords don't match."; return; }
    $("#np-go").disabled = true;
    const { error } = await sb.auth.updateUser({ password: $("#np-pw").value });
    $("#np-go").disabled = false;
    if (error) $("#np-err").textContent = /different from the old/i.test(error.message || "") ? "That's your current password. Pick a different one." : error.message;
    else { resetDialog.open = false; closeDialog(); toast("Password updated. Use it to sign in on your other devices."); }
  };
}
dlg.addEventListener("close", () => { resetDialog.open = false; });
function renderAccount() {
  const el = $("#account"); if (!el) return;
  el.innerHTML = me.uid ? `<span>${esc(me.email || "")}</span><button class="btn small" type="button" id="chg-pw">Change password</button><button class="btn small" type="button" id="sign-out">Sign out</button>` : "";
  if ($("#chg-pw")) $("#chg-pw").onclick = () => resetDialog();
  if ($("#sign-out")) $("#sign-out").onclick = async () => { await sb.auth.signOut(); location.hash = "scores"; location.reload(); };
}

/* ---------- boot ---------- */
$("#view").addEventListener("click", e => { const b = e.target.closest("[data-join]"); if (!b) return; const [kind, id] = b.dataset.join.split(":"); joinFlow(kind, id, b); });
onRoute();
let lastDay = todayStr();
setInterval(() => { if (todayStr() !== lastDay) { lastDay = todayStr(); update(); } }, 60000);
let started = false;
async function startData(session) {
  if (started && me.uid === session.user.id) { me.email = session.user.email; renderAccount(); return; }
  if (startData.busy) return startData.busy;
  startData.busy = startDataInner(session).finally(() => { startData.busy = null; });
  return startData.busy;
}
async function startDataInner(session) {
  me.uid = session.user.id; me.email = session.user.email;
  try { const { data } = await sb.rpc("is_admin"); me.isOwner = !!data; } catch {}
  renderAccount();
  if (started) { mount(); update(); return; }
  started = true;
  db = makeDb(sb);
  const sub = name => db.collection(name).onSnapshot(snap => {
    const m = new Map(snap.docs.map(x => [x.id, name === "players" ? { id: x.id, ...x.data() } : x.data()]));
    if (name === "players") S.players = m; else S.raw[name] = m;
    if (name !== "players" && name !== "memberships") rebuildDefs();
    S.loaded[name] = true;
    if (Object.values(S.loaded).every(Boolean)) statusMsg = "";
    update();
  }, err => { statusMsg = "Couldn't load the scoreboard (" + (err?.message || "error") + "). Reload to try again."; S.loaded[name] = true; renderStatus(); });
  ["players", "leaguedefs", "cupdefs", "memberships"].forEach(sub);
  db.doc("meta/calendar").onSnapshot(s => { S.calendar = s.exists ? s.data() : null; }, () => {});
}
(async () => {
  const cfg = window.KRILLION_CONFIG || {};
  if (!window.supabase || !cfg.supabaseUrl || cfg.supabaseUrl.includes("YOUR-")) {
    me.booted = true; statusMsg = "This site isn't connected to its database yet. Fill in config.js with your Supabase URL and anon key."; renderStatus(); mount(); return;
  }
  // implicit flow: email links carry the tokens themselves, so they work on a different device
  // from the one that asked for them (the PKCE flow only works in the same browser)
  sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { auth: { flowType: "implicit", detectSessionInUrl: true, persistSession: true, autoRefreshToken: true } });
  // don't call Supabase inside this callback (it can deadlock the auth lock): hand off with setTimeout
  sb.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY") setTimeout(resetDialog, 0);
    if (event === "SIGNED_OUT") return;
    if (session) setTimeout(() => startData(session), 0);
  });
  const { data: { session } } = await sb.auth.getSession();
  me.booted = true;
  if (AUTH_HASH.error) {
    ui.authMsg = { text: AUTH_HASH.code === "otp_expired" || /expired|invalid/i.test(AUTH_HASH.error) ? "That email link has expired or was already used (some email apps open links to scan them). Request a new one below and open it straight away." : AUTH_HASH.error };
    history.replaceState(null, "", location.pathname + "#scores");
  }
  if (session) { await startData(session); if (AUTH_HASH.recovery) resetDialog(); }
  else { statusMsg = ""; renderStatus(); mount(); }
})();
</script>
</body>
</html>
